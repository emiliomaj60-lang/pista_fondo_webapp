{% extends "base.html" %}

{% block content %}
<h2>Prenota una Lezione</h2>
<p>Compila il modulo seguente per richiedere una lezione con la nostra scuola sci di fondo.</p>

<form method="POST">

    <label>Nome:</label>
    <input type="text" name="nome" required>

    <label>Email:</label>
    <input type="email" name="email" required>

    <label>Telefono:</label>
    <input type="text" name="telefono">

    <label>Data lezione:</label>
    <input type="date" name="data" required>

    <label>Orario preferito:</label>
    <input type="time" name="orario">

    <label>Livello:</label>
    <select name="livello">
        <option>Principiante</option>
        <option>Intermedio</option>
        <option>Avanzato</option>
    </select>

    <label>Note:</label>
    <textarea name="note"></textarea>

    <button type="submit">Invia prenotazione</button>

</form>

{% endblock %}
