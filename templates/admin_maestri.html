{% extends "admin_base.html" %}

{% block content %}
<h2>Gestione Maestri</h2>

<table border="1" cellpadding="8">
    <tr>
        <th>Nome</th>
        <th>Specializzazione</th>
        <th>Anni esperienza</th>
    </tr>

    {% for m in maestri %}
    <tr>
        <td>{{ m.nome }}</td>
        <td>{{ m.specializzazione }}</td>
        <td>{{ m.esperienza }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
